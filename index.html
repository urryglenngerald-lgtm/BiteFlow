<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BiteFlow</title>
<meta name="description" content="Healthy meals for busy people. 24 new recipes every Monday.">
<meta name="theme-color" content="#F7F3E8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen phone app on warm cream. Header, filter rail, three sliding views
   (Discover deck / This week grid / Saved grid), floating glass tab bar. Recipe opens by growing out of its card. */
:root{
  color-scheme:light;
  /* brand */
  --cream:#F7F3E8; --ink:#1B1B1B; --green:#1F6B4F; --green-2:#2A8A63; --lime:#A8E063; --coral:#FF7A5C;
  /* derived */
  --muted:#5C5C50; --line:rgba(31,107,79,.14); --tint:#ECF4DE;
  --glass:rgba(255,253,247,.6); --glass-hi:rgba(255,253,247,.82); --hair:rgba(255,255,255,.9);
  --dark-glass:rgba(16,26,20,.46); --on-dark:#FFFDF7;
  --glow-lime:0 0 0 1px rgba(168,224,99,.55),0 10px 28px -6px rgba(168,224,99,.9);
  --glow-green:0 14px 30px -10px rgba(31,107,79,.65);
  --lift:0 18px 40px -22px rgba(27,27,27,.45);
  --r-card:28px; --r-panel:22px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --display:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.34,1.5,.5,1); --out:cubic-bezier(.2,.8,.2,1); --in:cubic-bezier(.55,0,.8,.2);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(60% 40% at 92% 6%,rgba(168,224,99,.32),transparent 70%),radial-gradient(55% 35% at 0% 92%,rgba(31,107,79,.14),transparent 70%),radial-gradient(40% 30% at 10% 30%,rgba(255,122,92,.10),transparent 70%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,.card:focus-visible,.tile:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--hair);box-shadow:inset 0 0 0 1px var(--line),var(--lift)}

.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.brand{display:flex;align-items:center;gap:8px;margin:0}
.brand img{height:30px;width:auto}
.word{font-family:var(--display);font-weight:800;font-style:italic;font-size:25px;letter-spacing:-.03em;line-height:1}
.word em{color:var(--green)}
.drop{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--green);padding:7px 12px;border-radius:var(--r-pill);white-space:nowrap}
.drop i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px rgba(168,224,99,.35),0 0 10px var(--lime)}
.greet{font-family:var(--display);font-weight:800;font-size:clamp(24px,7vw,30px);letter-spacing:-.035em;line-height:1.05;margin:var(--s4) 0 2px}
.greet span{color:var(--green)}
.sub{display:flex;gap:6px;align-items:baseline;color:var(--muted);font-size:13px;font-weight:600;margin:0 0 var(--s3)}
.sub b{color:var(--ink);font-weight:800}
.preview{background:var(--coral);color:#1B1B1B;border-radius:12px;padding:7px 12px;font-size:12px;font-weight:700;text-align:center;margin-bottom:var(--s2)}

/* filter rail with sliding indicator */
.rail{position:relative;height:42px;margin-bottom:var(--s3)}
.chips,.railtitle{position:absolute;inset:0;transition:opacity .22s var(--out),transform .3s var(--out)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px;border-radius:var(--r-pill)}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;z-index:1;flex:none;padding:0 15px;height:36px;border-radius:var(--r-pill);font-size:14px;font-weight:700;color:var(--muted);transition:color .2s}
.chip[aria-pressed="true"]{color:var(--cream)}
.chipdot{position:absolute;z-index:0;top:3px;height:36px;border-radius:var(--r-pill);background:var(--green);box-shadow:var(--glow-green);transition:transform .36s var(--spring),width .36s var(--spring)}
.railtitle{display:flex;align-items:center;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;opacity:0;transform:translateY(8px);pointer-events:none}
.rail.saved .chips{opacity:0;transform:translateY(-8px);pointer-events:none}
.rail.saved .railtitle{opacity:1;transform:none}
.chipdot{transition:transform .36s var(--spring),width .36s var(--spring),opacity .2s}
.rail.saved .chipdot{opacity:0}

/* views */
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform .32s var(--out),opacity .26s var(--out)}
.view[data-pos="left"]{transform:translateX(-34%);opacity:0;pointer-events:none;visibility:hidden;transition:transform .32s var(--out),opacity .2s,visibility 0s .32s}
.view[data-pos="right"]{transform:translateX(34%);opacity:0;pointer-events:none;visibility:hidden;transition:transform .32s var(--out),opacity .2s,visibility 0s .32s}
.scroll{overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));margin-inline:-4px;padding-inline:4px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* deck */
.deck{flex:1;min-height:0;position:relative}
.card{position:absolute;inset:0;border-radius:var(--r-card);overflow:hidden;box-shadow:0 26px 50px -26px rgba(27,27,27,.6),0 0 0 1px rgba(27,27,27,.04);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
  background-size:cover;background-position:center top;transition:transform .42s var(--spring),opacity .3s;will-change:transform}
.card:active{cursor:grabbing}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,13,0) 50%,rgba(10,18,13,.55) 100%)}
.topline{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.tag{font-family:var(--mono);font-size:12px;color:var(--on-dark);padding:5px 10px;border-radius:var(--r-pill);background:rgba(16,26,20,.38);border:1px solid rgba(255,255,255,.22)}
.tag.star{color:#FFD9CF}
.info{position:absolute;left:12px;right:12px;bottom:12px;border-radius:var(--r-panel);padding:16px;display:flex;flex-direction:column;gap:6px;color:var(--on-dark);
  background:var(--dark-glass);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.card.top .info{-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.info .eyebrow{color:var(--lime)}
.info h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,7vw,29px);line-height:1.04;letter-spacing:-.03em;margin:0;text-wrap:balance}
.info p{margin:0;font-size:15px;line-height:1.4;color:rgba(255,253,247,.88)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill{font-family:var(--mono);font-size:12.5px;padding:5px 10px;border-radius:var(--r-pill);background:rgba(255,253,247,.14);font-variant-numeric:tabular-nums}
.pill.hi{background:var(--lime);color:#1B1B1B;font-weight:500;box-shadow:0 0 16px rgba(168,224,99,.55)}
.stamp{position:absolute;top:56px;font-family:var(--display);font-weight:800;font-style:italic;font-size:26px;text-transform:uppercase;padding:6px 16px;border-radius:14px;opacity:0;pointer-events:none}
.stamp.open{left:18px;color:#1B1B1B;background:var(--lime);transform:rotate(-12deg);box-shadow:var(--glow-lime)}
.stamp.skip{right:18px;color:var(--cream);background:#1B1B1B;transform:rotate(12deg)}
.hint{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:var(--r-pill);background:rgba(16,26,20,.55);pointer-events:none;white-space:nowrap;animation:nudge 1.6s var(--out) .6s 2 both}
.hint svg{width:22px;height:22px}
@keyframes nudge{0%,100%{transform:translate(-50%,-50%)}40%{transform:translate(calc(-50% + 18px),-50%)}}

.skeleton{position:absolute;inset:0;border-radius:var(--r-card);background:linear-gradient(100deg,#ECE6D6 30%,#F8F4EA 50%,#ECE6D6 70%);background-size:300% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);text-align:center;border-radius:var(--r-card);padding:var(--s5)}
.empty img{height:56px;width:auto}
.empty h3{font-family:var(--display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.02em}
.empty p{color:var(--muted);margin:0;max-width:30ch;line-height:1.5;font-size:15px}
.btn{background:var(--green);color:var(--cream);border-radius:var(--r-pill);padding:14px 22px;font-weight:800;font-size:15px;box-shadow:var(--glow-green);transition:transform .15s var(--spring)}
.btn:active{transform:scale(.94)}

/* main actions */
.actions{display:flex;align-items:center;justify-content:center;gap:22px;padding:14px 0 calc(92px + env(safe-area-inset-bottom,0px))}
.round{display:grid;place-items:center;border-radius:50%;transition:transform .18s var(--spring),box-shadow .2s;position:relative}
.round:active{transform:scale(.88)}
.round svg{width:26px;height:26px}
.r-skip{width:58px;height:58px;color:var(--ink)}
.r-save{width:58px;height:58px;color:var(--coral)}
.r-save[aria-pressed="true"] svg path{fill:currentColor}
.r-open{width:76px;height:76px;background:var(--green);color:var(--lime);box-shadow:var(--glow-green),0 0 0 6px rgba(168,224,99,.28)}
.r-open svg{width:32px;height:32px}
.pop{animation:pop .42s var(--spring)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
.burst{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--coral);pointer-events:none;animation:burst .55s var(--out) forwards}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

/* grids (This week, Saved) */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin:0;padding:2px 0 0;list-style:none}
.tile{width:100%;text-align:left;border-radius:var(--r-panel);overflow:hidden;background:var(--glass-hi);border:1px solid var(--hair);box-shadow:inset 0 0 0 1px var(--line),0 12px 26px -20px rgba(27,27,27,.5);display:flex;flex-direction:column;transition:transform .18s var(--spring)}
.tile:active{transform:scale(.96)}
.tile .ph{aspect-ratio:1/1;background-size:cover;background-position:center 18%;position:relative}
.tile .ph .tag{position:absolute;top:8px;left:8px;font-size:11px;padding:3px 8px}
.tile .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile strong{font-family:var(--display);font-weight:800;font-size:15px;line-height:1.2;letter-spacing:-.01em}
.tile small{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;column-gap:8px}
.tile small b{color:var(--green);font-weight:500}
.enter{animation:rise .42s var(--out) both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.gridempty{grid-column:1/-1;text-align:center;padding:48px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.gridempty h3{font-family:var(--display);font-weight:800;font-size:21px;margin:0}
.gridempty p{color:var(--muted);margin:0;line-height:1.5;max-width:30ch}
.gridempty .heart{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:var(--coral)}
.gridempty .heart svg{width:30px;height:30px}

/* floating tab bar */
.tabbar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:66px;border-radius:24px;padding:6px;display:grid;grid-template-columns:repeat(3,1fr);z-index:20}
.tabdot{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:18px;background:var(--green);box-shadow:var(--glow-green),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .38s var(--spring)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted);transition:color .2s}
.tab svg{width:23px;height:23px;transition:transform .3s var(--spring)}
.tab[aria-current="page"]{color:var(--cream)}
.tab[aria-current="page"] svg{color:var(--lime);transform:translateY(-1px) scale(1.12)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--coral);color:#1B1B1B;font-family:var(--mono);font-size:11px;display:grid;place-items:center;border:2px solid var(--cream)}
.badge[data-n="0"]{display:none}
.badge.pop{animation:pop .42s var(--spring)}

/* recipe sheet: grows out of the card it came from */
.sheet{position:fixed;inset:0;background:var(--cream);overflow-y:auto;overscroll-behavior:contain;z-index:40;visibility:hidden;clip-path:inset(100% 0 0 0)}
.sheet.show{visibility:visible}
.hero{position:relative;height:min(48vh,420px);background-size:cover;background-position:center 30%;border-radius:0 0 32px 32px;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:30%;background:linear-gradient(180deg,transparent,rgba(10,18,13,.28))}
.fab{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));width:48px;height:48px;border-radius:50%;display:grid;place-items:center;z-index:2;color:var(--ink);transition:transform .18s var(--spring)}
.fab:active{transform:scale(.88)}
.fab svg{width:22px;height:22px}
.fab.back{left:max(16px,env(safe-area-inset-left,0px))}
.fab.fav{right:max(16px,env(safe-area-inset-right,0px));color:var(--coral)}
.fab.fav[aria-pressed="true"] svg path{fill:currentColor}
.body{max-width:560px;margin:-40px auto 0;position:relative;display:flex;flex-direction:column;gap:var(--s5);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(120px + env(safe-area-inset-bottom,0px))}
.sheet .body>*{opacity:0;transform:translateY(16px)}
.sheet.in .body>*{opacity:1;transform:none;transition:opacity .35s var(--out),transform .45s var(--out)}
.titlecard{border-radius:var(--r-card);padding:20px}
.titlecard .eyebrow{color:var(--green)}
.titlecard h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,38px);line-height:1.03;letter-spacing:-.035em;margin:6px 0 10px;text-wrap:balance}
.titlecard p{margin:0;color:var(--muted);line-height:1.55}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.meta span{background:var(--tint);color:var(--green);border-radius:var(--r-pill);padding:6px 12px;font-size:13px;font-weight:700}

.nutri{border-radius:var(--r-card);padding:20px;display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dasharray .9s var(--out)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ctr b{font-family:var(--mono);font-weight:500;font-size:30px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.ring .ctr span{font-size:12px;color:var(--muted);font-weight:700}
.bars{display:flex;flex-direction:column;gap:10px;min-width:0}
.bar .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.bar .lab b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.bar .tr{height:8px;border-radius:8px;background:rgba(31,107,79,.1);overflow:hidden;margin-top:5px}
.bar .tr i{display:block;height:100%;border-radius:8px;transform-origin:left;transform:scaleX(0);transition:transform .8s var(--out)}
.sheet.in .bar .tr i{transform:scaleX(var(--v))}
.nutri .foot{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;font-size:14px;color:var(--muted)}
.nutri .foot b{font-family:var(--mono);font-weight:500;color:var(--ink)}

h3.sec{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 2px;letter-spacing:-.02em}
.subt{color:var(--muted);font-size:14px;margin:0 0 8px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.ing li span:last-child{font-family:var(--mono);color:var(--muted);white-space:nowrap;font-size:14px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:16px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;line-height:1.6}
.steps li::before{content:counter(s);font-family:var(--mono);width:34px;height:34px;border-radius:50%;background:var(--lime);color:#1B1B1B;display:grid;place-items:center;font-size:14px;box-shadow:0 0 14px rgba(168,224,99,.6)}
.tipbox{background:var(--tint);border-radius:18px;padding:14px 16px;line-height:1.5;margin:0;font-size:15px}
.tipbox b{color:var(--green)}
.rate{border-radius:var(--r-card);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.rate h3{font-family:var(--display);font-weight:800;font-size:20px;margin:0}
.stars{display:flex;gap:4px}
.stars button{color:#D9D2C0;line-height:0;padding:3px;border-radius:10px;transition:transform .18s var(--spring),color .15s}
.stars button svg{width:40px;height:40px}
.stars button.on{color:var(--coral);filter:drop-shadow(0 0 8px rgba(255,122,92,.45))}
.stars button.pop{animation:pop .4s var(--spring)}
.rate p{margin:0;font-size:14px;color:var(--muted)}
.rate p b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(130%);transition:transform .38s var(--spring);pointer-events:none}
.dock.show{transform:none;pointer-events:auto}
.dock .inner{width:100%;max-width:528px;border-radius:24px;padding:8px;display:flex;gap:8px;align-items:center}
.dock .btn{flex:1;white-space:nowrap;padding-inline:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.dock .btn svg{width:20px;height:20px}
.dock .btn[aria-pressed="true"]{background:var(--coral);color:#1B1B1B;box-shadow:0 12px 28px -10px rgba(255,122,92,.8)}
.dock .btn[aria-pressed="true"] svg path{fill:currentColor}
.dock .kc{font-family:var(--mono);font-size:12px;color:var(--muted);padding:0 4px 0 10px;white-space:nowrap;display:flex;flex-direction:column;line-height:1.35}
.dock .kc b{color:var(--ink);font-weight:500}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;background:#1B1B1B;color:var(--cream);font-weight:700;font-size:14px;padding:10px 16px;border-radius:var(--r-pill);transition:transform .3s var(--spring),opacity .2s;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="brand"><img src="assets/leaf.png" alt=""><span class="word">Bite<em>Flow</em></span></h1>
    <div class="drop glass" id="drop" hidden><i></i><span></span></div>
  </header>
  <div id="previewBanner"></div>
  <p class="greet" id="greet">What are we <span>eating?</span></p>
  <p class="sub" id="sub"></p>
  <div class="rail" id="rail">
    <span class="chipdot" id="chipdot"></span>
    <div class="chips" id="chips" role="group" aria-label="Filters"></div>
    <div class="railtitle" id="railtitle">Your saved meals</div>
  </div>

  <div class="views">
    <section class="view" id="vDiscover" data-pos="center" aria-label="Discover">
      <div class="deck" id="deck" aria-live="polite"><div class="skeleton"></div></div>
      <div class="actions">
        <button class="round r-skip glass" id="skipBtn" aria-label="Skip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <button class="round r-open" id="openBtn" aria-label="Open recipe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <button class="round r-save glass" id="saveBtn" aria-label="Save" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
      </div>
    </section>
    <section class="view" id="vWeek" data-pos="right" aria-label="This week">
      <div class="scroll"><ul class="grid" id="weekGrid"></ul></div>
    </section>
    <section class="view" id="vSaved" data-pos="right" aria-label="Saved">
      <div class="scroll"><ul class="grid" id="savedGrid"></ul></div>
    </section>
  </div>

  <nav class="tabbar glass" id="tabbar" aria-label="Sections">
    <span class="tabdot" id="tabdot"></span>
    <button class="tab" data-tab="0" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="3.5" width="12" height="17" rx="3" transform="rotate(-8 12 12)"/><path d="M4 7.5v10M20 7.5v10" stroke-linecap="round" opacity=".5"/></svg>Discover</button>
    <button class="tab" data-tab="1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>This week</button>
    <button class="tab" data-tab="2">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span class="badge" id="savedCount" data-n="0">0</span>Saved</button>
  </nav>
</div>

<section class="sheet" id="detail" aria-label="Recipe"></section>
<div class="dock" id="dock"><div class="inner glass"><span class="kc" id="dockKcal"></span><button class="btn" id="dockSave" aria-pressed="false"></button></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
