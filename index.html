<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BiteFlow</title>
<meta name="description" content="Healthy meals for busy people. 24 new recipes every Monday.">
<meta name="theme-color" content="#F7F3E8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,800&family=DM+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0;padding:0}
/* Layout: one-screen phone app. Brand header, filter chips, card deck, action row, tab bar. Recipe page slides up over it. */
:root{
  --bg:#F7F3E8; --surface:#FFFDF8; --ink:#1B1B1B; --muted:#67675C; --line:#E5DFCF;
  --green:#1F6B4F; --green-ink:#1F6B4F; --lime:#A8E063; --coral:#FF7A5C; --tint:#ECF6DC;
  --panel:#1F6B4F; --on-panel:#F7F3E8;
  --on-image:#FFFFFF; --shadow:0 18px 36px -20px rgba(27,27,27,.45); --soft:0 6px 18px -10px rgba(27,27,27,.35);
  color-scheme:light;
  --display:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:3px solid var(--lime);outline-offset:2px}

.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;margin:0}
.brand img{height:30px;width:auto}
.word{font-family:var(--display);font-weight:800;font-style:italic;font-size:25px;letter-spacing:-.03em;line-height:1}
.word em{font-style:italic;color:var(--green-ink)}
.today{font-size:12px;font-weight:600;color:var(--muted);text-align:right;line-height:1.3}
.greet{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0;line-height:1.15}
.greet span{color:var(--green-ink)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-top:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#F7F3E8}

.deck{flex:1;min-height:0;position:relative;margin-top:2px}
.card{position:absolute;inset:0;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;background-size:cover;background-position:center}
.card:active{cursor:grabbing}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,22,17,0) 38%,rgba(12,22,17,.86) 100%)}
.slot{position:absolute;top:18px;left:50%;transform:translateX(-50%);color:var(--on-image);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.8;white-space:nowrap}
.info{position:absolute;left:20px;right:20px;bottom:20px;color:var(--on-image);display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.info .eyebrow{color:var(--lime)}
.info h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.4vw,31px);line-height:1.04;letter-spacing:-.025em;margin:0;text-wrap:balance}
.info p{margin:0;font-size:14px;opacity:.88;line-height:1.4}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pill{font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(247,243,232,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
.pill.hi{background:var(--lime);color:#1B1B1B;font-weight:500}
.stamp{position:absolute;top:46px;font-family:var(--display);font-weight:800;font-style:italic;font-size:24px;letter-spacing:.02em;text-transform:uppercase;padding:5px 14px;border-radius:12px;opacity:0;pointer-events:none}
.stamp.open{left:20px;color:#1B1B1B;background:var(--lime);transform:rotate(-12deg)}
.stamp.skip{right:20px;color:#F7F3E8;background:#1B1B1B;transform:rotate(12deg)}

.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border:2px dashed var(--line);border-radius:28px;padding:24px}
.empty img{height:56px;width:auto}
.empty h3{font-family:var(--display);font-weight:800;font-size:22px;margin:0}
.empty p{color:var(--muted);margin:0;max-width:30ch;line-height:1.45}
.btn{border:0;background:var(--green);color:#F7F3E8;border-radius:999px;padding:12px 20px;font-weight:700}

.actions{display:flex;align-items:center;justify-content:center;gap:22px}
.round{display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:var(--soft);transition:transform .15s}
.round:active{transform:scale(.92)}
.round svg{width:26px;height:26px}
.r-skip{width:60px;height:60px;color:var(--ink)}
.r-save{width:48px;height:48px;color:var(--coral)}
.r-save svg{width:22px;height:22px}
.r-save[aria-pressed="true"] svg path{fill:currentColor}
.r-open{width:68px;height:68px;background:var(--green);border-color:var(--green);color:var(--lime)}
.r-open svg{width:30px;height:30px}
.hint{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600;margin:-4px 0 0}
.speed{display:inline-flex;flex-direction:column;gap:3px}
.speed i{display:block;height:3px;border-radius:3px;background:var(--lime)}
.speed i:first-child{width:14px}.speed i:last-child{width:10px}

.tabs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--green-ink)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--coral);color:#1B1B1B;font-family:var(--mono);font-size:11px;display:grid;place-items:center}
.badge[data-n="0"]{display:none}

/* Recipe page */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:30;overscroll-behavior:contain}
.sheet.show{transform:none}
.hero{position:relative;height:min(46vh,380px);background-size:cover;background-position:center;border-radius:0 0 28px 28px;overflow:hidden}
.hero .slot{top:auto;bottom:18px}
.fab{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--soft)}
.fab svg{width:22px;height:22px}
.fab.back{left:max(16px,env(safe-area-inset-left,0px))}
.fab.fav{right:max(16px,env(safe-area-inset-right,0px));color:var(--coral)}
.fab.fav[aria-pressed="true"] svg path{fill:currentColor}
.body{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:26px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px calc(40px + env(safe-area-inset-bottom,0px))}
.title h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1.04;letter-spacing:-.03em;margin:6px 0 10px;text-wrap:balance}
.title .eyebrow{color:var(--green-ink)}
.title p{margin:0;color:var(--muted);line-height:1.55;max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.meta span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}

.panel{background:var(--panel);color:var(--on-panel);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.panel .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--lime)}
.kcal{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kcal strong{font-family:var(--mono);font-weight:500;font-size:50px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.kcal span{opacity:.8;font-size:14px}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:3px}
.bar i{display:block;height:100%;border-radius:99px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro{display:flex;flex-direction:column;gap:2px;min-width:0;background:rgba(247,243,232,.08);border-radius:14px;padding:10px}
.macro .lab{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.08em}
.macro .lab i{width:9px;height:9px;border-radius:50%;flex:none}
.macro b{font-family:var(--mono);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.macro small{opacity:.7;font-size:11px;font-family:var(--mono)}
.extra{display:flex;justify-content:space-between;gap:12px;border-top:1px solid rgba(247,243,232,.18);padding-top:12px;font-size:14px}
.extra span{opacity:.8}
.extra b{font-family:var(--mono);font-weight:500}

h3.sec{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.ing li span:last-child{font-family:var(--mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:16px}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;line-height:1.6;font-size:15px}
.steps li::before{content:counter(s);font-family:var(--mono);font-weight:500;width:32px;height:32px;border-radius:50%;background:var(--lime);color:#1B1B1B;display:grid;place-items:center;font-size:14px}
.tip{background:var(--tint);border-radius:16px;padding:14px 16px;line-height:1.5;margin:0;font-size:14px}
.tip b{color:var(--green-ink)}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}

/* Saved list */
.saved-sheet{z-index:20}
.saved-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:12px;z-index:2;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) 12px;border-bottom:1px solid var(--line)}
.saved-head h2{font-family:var(--display);font-weight:800;margin:0;font-size:24px;letter-spacing:-.02em}
.saved-head .fab{position:static;box-shadow:none;border:1px solid var(--line)}
.slist{list-style:none;margin:0 auto;max-width:560px;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(30px + env(safe-area-inset-bottom,0px))}
.slist button{width:100%;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px}
.thumb{width:64px;height:64px;border-radius:14px;background-size:cover;background-position:center}
.slist strong{display:block;font-family:var(--display);font-weight:800;font-size:16px;line-height:1.2}
.slist small{color:var(--muted);font-family:var(--mono);font-size:12px}
.slist .none{color:var(--muted);text-align:center;padding:40px 0}

@media (prefers-reduced-motion: reduce){.card,.sheet,.round{transition-duration:.01s!important}}

/* ---- Weekly drops, cuisine label, ratings (added Nov 2026) ---- */
.weekline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-6px 0 0;font-size:12px;font-weight:700;color:var(--muted)}
.weekline b{color:var(--green-ink);font-weight:800}
.weekline .drop{font-family:var(--mono);font-weight:500;font-size:11px;background:var(--tint);color:var(--green-ink);border-radius:999px;padding:4px 9px;white-space:nowrap}
.preview{background:var(--coral);color:#1B1B1B;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:700;text-align:center}
.pill.star{background:rgba(27,27,27,.55)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:700}

.rate{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.rate h3{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;padding:2px;color:var(--line);line-height:0;border-radius:8px}
.stars button svg{width:38px;height:38px}
.stars button.on{color:var(--coral)}
.stars button:active{transform:scale(.9)}
.rate p{margin:0;font-size:13px;color:var(--muted)}
.rate p b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.slist .avg{color:var(--coral);font-family:var(--mono);font-size:12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="brand"><img src="assets/leaf.png" alt=""><span class="word">Bite<em>Flow</em></span></h1>
    <div class="today" id="today"></div>
  </header>
  <p class="greet" id="greet">What are we <span>eating?</span></p>
  <div class="weekline" id="weekline"></div>
  <div class="chips" id="chips" role="group" aria-label="Filters"></div>
  <div class="deck" id="deck" aria-live="polite"><div class="loading">Loading this week's menu…</div></div>
  <div class="actions">
    <button class="round r-skip" id="skipBtn" aria-label="Skip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="round r-open" id="openBtn" aria-label="Open recipe">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <button class="round r-save" id="saveBtn" aria-label="Save" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
  </div>
  <p class="hint"><span class="speed" aria-hidden="true"><i></i><i></i></span>Swipe right to cook it, left to skip</p>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" id="tabDiscover" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="3"/><path d="M9 16h6" stroke-linecap="round"/></svg>Discover</button>
    <button class="tab" id="savedBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span class="badge" id="savedCount" data-n="0">0</span>Saved</button>
  </nav>
</div>

<section class="sheet saved-sheet" id="savedSheet" aria-label="Saved recipes">
  <div class="saved-head">
    <button class="fab back" id="savedClose" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h2>Saved meals</h2>
  </div>
  <ul class="slist" id="savedList"></ul>
</section>

<section class="sheet" id="detail" aria-label="Recipe"></section>

<script src="app.js"></script>
</body>
</html>
