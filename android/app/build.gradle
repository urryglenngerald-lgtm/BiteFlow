plugins { id 'com.android.application' }

android {
  namespace 'mt.biteflow.app'
  compileSdk 34
  defaultConfig {
    applicationId 'mt.biteflow.app'
    minSdk 24
    targetSdk 34
    def vc = (project.findProperty('versionCode') ?: '1').toString()
    versionCode = vc.toInteger()
    versionName = "1." + vc
  }
  // Practice-app key, kept in the repo so every build can update the last one.
  // Before any Play Store release, make a new private key and keep it out of the repo.
  signingConfigs {
    release {
      storeFile file('biteflow.keystore')
      storePassword 'biteflow'
      keyAlias 'biteflow'
      keyPassword 'biteflow'
    }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.release }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
