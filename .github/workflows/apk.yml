# Builds the BiteFlow Android app and publishes it at
# https://github.com/urryglenngerald-lgtm/BiteFlow/releases/latest/download/BiteFlow.apk
name: Build APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk BiteFlow.apk
          gh release create "apk-${{ github.run_number }}" BiteFlow.apk --latest \
            --title "BiteFlow app (build ${{ github.run_number }})" \
            --notes "Install BiteFlow.apk on Android. The app loads the live site, so new weekly menus appear without a new APK."
